<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F8FAFC" />
    <title>B.Tech Student Performance Advisor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    
    <!-- Preconnect for fast resource downloading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js"></script>

    <script>
      // Strictly enforce LIGHT THEME across all browser sessions & accounts
      try {
        localStorage.setItem("stActiveTheme", JSON.stringify({
          base: "light",
          primaryColor: "#1D4ED8",
          backgroundColor: "#F8FAFC",
          secondaryBackgroundColor: "#FFFFFF",
          textColor: "#0F172A"
        }));
        // Remove any legacy dark theme overrides
        if (localStorage.getItem("theme") === "dark") {
          localStorage.setItem("theme", "light");
        }
      } catch (e) {}
    </script>

    <style>
      :root {
        color-scheme: light !important;
      }
      body, html {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F8FAFC !important;
        color: #0F172A !important;
      }

      /* Instant Loading Splash Screen */
      #fast-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #F8FAFC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      .loader-card {
        background: #FFFFFF;
        border: 1.5px solid #E2E8F0;
        border-radius: 16px;
        padding: 2.2rem 2.5rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      }

      .loader-badge {
        display: inline-block;
        background: #EFF6FF;
        color: #2563EB;
        font-weight: 700;
        font-size: 0.78rem;
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        margin-bottom: 0.9rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .loader-title {
        font-size: 1.35rem;
        font-weight: 800;
        color: #1E3A8A;
        margin: 0 0 0.5rem 0;
        line-height: 1.3;
      }

      .loader-desc {
        font-size: 0.92rem;
        color: #64748B;
        margin: 0 0 1.5rem 0;
        line-height: 1.5;
      }

      .progress-bar-container {
        width: 100%;
        height: 6px;
        background: #E2E8F0;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 0.8rem;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #2563EB, #3B82F6, #60A5FA);
        border-radius: 4px;
        animation: progressAnim 1.8s ease-in-out infinite;
      }

      @keyframes progressAnim {
        0% { width: 15%; margin-left: 0%; }
        50% { width: 65%; margin-left: 20%; }
        100% { width: 15%; margin-left: 85%; }
      }

      .loader-footer {
        font-size: 0.78rem;
        color: #94A3B8;
      }

      /* Global override for BaseWeb inputs and select controls */
      div[data-baseweb="input"],
      div[data-baseweb="base-input"],
      [data-testid="stTextInput"] div[data-baseweb="input"],
      [data-testid="stNumberInput"] div[data-baseweb="input"],
      [data-testid="stSelectbox"] div[data-baseweb="select"] > div {
        background-color: #FFFFFF !important;
        background: #FFFFFF !important;
        border: 1.5px solid #CBD5E1 !important;
        color: #0F172A !important;
      }
      input, textarea, select {
        background-color: #FFFFFF !important;
        background: #FFFFFF !important;
        color: #0F172A !important;
        -webkit-text-fill-color: #0F172A !important;
      }
      [data-testid="stNumberInputStepDown"],
      [data-testid="stNumberInputStepUp"] {
        background-color: #F1F5F9 !important;
        background: #F1F5F9 !important;
        color: #334155 !important;
        border-left: 1px solid #CBD5E1 !important;
      }
      [data-testid="stNumberInputStepDown"] svg,
      [data-testid="stNumberInputStepUp"] svg {
        fill: #334155 !important;
      }
      /* Prevent any tooltip icon from rendering as a solid black dot */
      [data-testid="stTooltipIcon"],
      [data-testid="stTooltipIcon"] button {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      [data-testid="stTooltipIcon"] svg {
        fill: #94A3B8 !important;
        color: #94A3B8 !important;
      }
      div[data-baseweb="select"] span, div[data-baseweb="select"] div {
        color: #0F172A !important;
        -webkit-text-fill-color: #0F172A !important;
      }
      div[data-baseweb="select"] svg {
        fill: #475569 !important;
      }
    </style>
  </head>
  <body>
    <!-- Instant Home Page Loader (Displays within 50ms) -->
    <div id="fast-loader">
      <div class="loader-card">
        <div class="loader-badge">⚡ Instant Cloud Launch</div>
        <div style="font-size: 2.8rem; margin-bottom: 0.4rem;">🎓</div>
        <h2 class="loader-title">B.Tech Student Performance Advisor</h2>
        <p class="loader-desc">Initializing AI Academic Engine and interactive components...</p>
        <div class="progress-bar-container">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="loader-footer">Optimized Light Theme • Zero-Server WebAssembly</div>
      </div>
    </div>

    <!-- Main Streamlit Application with explicit config.toml -->
    <streamlit-app src="./app.py">
      <app-file name="rules.py" url="./rules.py"></app-file>
      <app-file name=".streamlit/config.toml" url="./.streamlit/config.toml"></app-file>
    </streamlit-app>

    <script>
      // Dismiss fast loader as soon as Streamlit app renders
      const observer = new MutationObserver((mutations, obs) => {
        const appContainer = document.querySelector('[data-testid="stAppViewContainer"]') || document.querySelector('.stApp');
        if (appContainer) {
          const loader = document.getElementById('fast-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => {
              loader.style.display = 'none';
            }, 400);
          }
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback timeout to guarantee removal after app init
      setTimeout(() => {
        const loader = document.getElementById('fast-loader');
        if (loader && loader.style.display !== 'none') {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 400);
        }
      }, 7000);
    </script>
  </body>
</html>
